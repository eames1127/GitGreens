<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Stem -->
  <rect x="46" y="115" width="8" height="33" fill="#15803d" rx="2"/>
  <!-- Bush layers - pushed up for more height -->
  <ellipse cx="50" cy="108" rx="38" ry="22" fill="#16a34a" opacity="0.55"/>
  <ellipse cx="32" cy="100" rx="22" ry="16" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="68" cy="102" rx="20" ry="15" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="50" cy="90" rx="26" ry="18" fill="#22c55e"/>
  <ellipse cx="38" cy="84" rx="16" ry="12" fill="#4ade80" opacity="0.7"/>
  <ellipse cx="62" cy="86" rx="14" ry="11" fill="#4ade80" opacity="0.7"/>
  <!-- Flowers: 5 petals + centre -->
  <!-- Flower 1 -->
  <g transform="translate(28,90)">
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(0)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(72)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(144)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(216)"/>
