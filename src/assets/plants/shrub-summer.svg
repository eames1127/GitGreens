  </g>
  <!-- Flower 2 -->
  <g transform="translate(50,76)">
    <ellipse cx="0" cy="-5.5" rx="3.5" ry="5.5" fill="#fcd34d" transform="rotate(0)"/>
    <ellipse cx="0" cy="-5.5" rx="3.5" ry="5.5" fill="#fcd34d" transform="rotate(72)"/>
    <ellipse cx="0" cy="-5.5" rx="3.5" ry="5.5" fill="#fcd34d" transform="rotate(144)"/>
    <ellipse cx="0" cy="-5.5" rx="3.5" ry="5.5" fill="#fcd34d" transform="rotate(216)"/>
    <ellipse cx="0" cy="-5.5" rx="3.5" ry="5.5" fill="#fcd34d" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3.5" fill="#92400e"/>
  </g>
  <!-- Flower 3 -->
  <g transform="translate(70,88)">
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(0)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(72)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(144)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(216)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#fbbf24" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3" fill="#92400e"/>
